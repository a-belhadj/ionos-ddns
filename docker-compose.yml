services:
  dyndns:
    image: ghcr.io/a-belhadj/ionos-ddns:latest
    container_name: ionos-dyndns
    restart: unless-stopped
    # Values come from .env; no duplicate `environment:` block so there is a
    # single, unambiguous source of configuration.
    env_file:
      - .env
    # Health endpoint stays on the loopback interface, not on every NIC.
    ports:
      - "127.0.0.1:${HEALTH_PORT:-8080}:${HEALTH_PORT:-8080}"
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
