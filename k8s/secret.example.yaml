# Template only. Copy to k8s/secret.yaml (git-ignored) and fill in real values,
# or better, generate the Secret from a manager such as Sealed Secrets or
# External Secrets so credentials never reach the repository.
#
#   cp k8s/secret.example.yaml k8s/secret.yaml
#
apiVersion: v1
kind: Secret
metadata:
  name: ionos-dyndns-secret
  namespace: ionos-ddns
type: Opaque
stringData:
  IONOS_API_KEY: "prefix_public.secret"  # Replace with your actual API key
  IONOS_DOMAINS: "example.com,subdomain.example.com"  # Replace with your domains
